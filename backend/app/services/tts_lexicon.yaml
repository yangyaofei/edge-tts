# TTS 归一化词表: 约定俗成的读法 (动态注入 prompt, 命中才注入)
# 维护规则: 发现一个错例就加一条。LLM 不可靠的读法全部固化在这里。
#
# polyphone: 多音字 (find 原词 → to 替换形式, 拼音紧跟需替换的字, 无括号无空格)
#   注意: 拼音方案仅用于 LLM 无法从上下文判断的罕见场景, 高频多音词优先靠上下文
# unit:      单位/缩写读法
# model:     型号/产品名读法 (字母拆空格 + 数字转中文)

polyphone:
  # 只留 TTS 上下文消歧失败/歧义高危的词。上下文能读对的 (银行/音乐/成长/处理/重要等)
  # 一律不进词表 — 标注反而引入双读风险。
  参差: 参cēn差
  差劲: 差chà劲
  供不应求: gōng不yìng求
  削弱: 削xuē弱
  堵塞: 堵sè塞
  塞责: sè责
  挑衅: 挑tiǎo衅
  提防: 提dī防
  累计: 累lěi计
